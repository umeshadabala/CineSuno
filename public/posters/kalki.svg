<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e" />
      <stop offset="50%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#0a0515" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8c00" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1a0b2e" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)" />
  <circle cx="200" cy="240" r="160" fill="url(#glow)" />
  <!-- Chakra / Futuristic Wheel Motif -->
  <circle cx="200" cy="240" r="110" fill="none" stroke="#ffd700" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4" />
