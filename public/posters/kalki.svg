  <path d="M200 240 L210 320 L200 350 L190 320 Z" fill="url(#gold)" opacity="0.7" />
  
  <rect x="30" y="40" width="60" height="24" rx="4" fill="#ffd700" fill-opacity="0.2" stroke="#ffd700" stroke-width="1" />
  <text x="60" y="56" fill="#ffd700" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">UA 16+</text>

  <text x="370" y="56" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">★ 8.6</text>

