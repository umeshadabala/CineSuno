  <text x="200" y="475" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="8" text-anchor="middle">2898 AD</text>
  <text x="200" y="520" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="middle">ACTION • SCI-FI • MYTHOLOGY</text>
  <text x="200" y="550" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">TELUGU • HINDI • TAMIL • MALAYALAM</text>
